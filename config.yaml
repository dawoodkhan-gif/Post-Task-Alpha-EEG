# All paths and settings for the pipeline. Paths are relative to this file unless absolute.
dataset_root: ../../ds003478          # OpenNeuro ds003478 v1.1.0 (BIDS)
work_dir: ../Work                     # extracted epochs (large, not deposited)
results_dir: ../Results               # scores, statistics, tables, figures

participants:
  group_column: BDI
  high_min: 13                        # high-BDI group: BDI >= 13
  low_max: 7                          # low-BDI group: BDI <= 7
  invalid_column: SCID_notes
  invalid_value: INVALID PARTICIPANT
  anxiety_column: STAI
  interview_column: SCID

preprocessing:
  drop_channels: [HEOG, VEOG, EKG]
  l_freq: 1.0
  h_freq: 40.0
  sfreq: 128
  epoch_seconds: 2.0
  reject_peak_to_peak_uv: 200.0
  flat_uv: 0.5
  block_codes: [1, 2, 3, 4, 5, 6]     # odd codes eyes closed, even codes eyes open (original conversion script)
  trigger_spacing_seconds: 0.5        # last trigger of a block plus this spacing marks the block end
  alpha_band: [8.0, 12.0]
  alpha_channels: [O1, OZ, O2]

spectral:
  welch_seconds: 2.0
  fmin: 1.0
  fmax: 40.0
  bands: {delta: [1, 4], theta: [4, 8], alpha: [8, 13], beta: [13, 30], gamma: [30, 40]}
  primary_band: alpha
  iaf_range: [7.0, 14.0]
  iaf_channels: [O1, OZ, O2, PO7, PO8, POZ, P7, P8, PZ]
  regions:
    frontal: [FP1, FPZ, FP2, AF3, AF4, F7, F5, F3, F1, FZ, F2, F4, F6, F8]
    central: [FC5, FC3, FC1, FCZ, FC2, FC4, FC6, C5, C3, C1, CZ, C2, C4, C6]
    parietal: [CP5, CP3, CP1, CPZ, CP2, CP4, CP6, P7, P5, P3, P1, PZ, P2, P4, P6, P8]
    occipital: [PO7, PO5, PO3, POZ, PO4, PO6, PO8, O1, OZ, O2]

training:
  models: [EEGNet]
  outer_folds: 10
  repeats: [1, 2, 3]
  inner_validation_fraction: 0.15
  max_epochs: 40
  patience: 8
  batch_size: 64
  learning_rate: 0.001
  seed: 2026
  threads: 2

prediction:                         # out-of-sample prediction of depression relative to anxiety
  repeats: 5
  cnn_seeds: 5
  cnn_epochs: 300
  permutations: 1000

analysis:
  bootstrap: 2000
  permutations: 10000
  seed: 2026
